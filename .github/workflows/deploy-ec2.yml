name: Deploy and Run Churn Scoring on EC2

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-1
  INSTANCE_ID: i-02df6ed30cb32530d
  IMAGE_URI: 538471157590.dkr.ecr.ap-southeast-1.amazonaws.com/churn-scoring:latest

concurrency:
  group: churn-scoring-ec2-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # Step 1: Authenticate with AWS
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::538471157590:role/github-actions-churn-scoring-role
          aws-region: ${{ env.AWS_REGION }}

      # Step 2: Start EC2
      - name: Start EC2 instance
        id: ec2
        run: |
          STATE=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].State.Name' \
            --output text)

          if [ "$STATE" != "stopped" ]; then
            echo "EC2 must be stopped before deployment. Current state: $STATE"
            exit 1
          fi

          aws ec2 start-instances --instance-ids "$INSTANCE_ID"
          echo "started=true" >> "$GITHUB_OUTPUT"

          aws ec2 wait instance-running --instance-ids "$INSTANCE_ID"

          echo "EC2 instance is running."

      # Step 3: Wait until Systems Manager is ready
      - name: Wait for SSM
        run: |
          for attempt in {1..40}; do
            STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
              --query 'InstanceInformationList[0].PingStatus' \
              --output text)

            if [ "$STATUS" = "Online" ]; then
              echo "SSM is ready."
              exit 0
            fi

            echo "Waiting for SSM..."
            sleep 15
          done

          echo "SSM did not become ready."
          exit 1

      # Step 4: Pull Docker image and run predictions
      - name: Run scoring container
        run: |
          REGISTRY="538471157590.dkr.ecr.$AWS_REGION.amazonaws.com"

          REMOTE_SCRIPT=$(printf '%s\n' \
            'set -e' \
            "aws ecr get-login-password --region $AWS_REGION | sudo docker login --username AWS --password-stdin $REGISTRY" \
            "sudo docker pull $IMAGE_URI" \
            "sudo docker run --rm $IMAGE_URI")

          PARAMETERS=$(jq -nc \
            --arg script "$REMOTE_SCRIPT" \
            '{commands:[$script],executionTimeout:["3600"]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for attempt in {1..250}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || echo "Pending")

            if [ "$STATUS" = "Success" ]; then
              echo "Scoring completed successfully."

              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query 'StandardOutputContent' \
                --output text

              exit 0
            fi

            if [[ "$STATUS" == "Failed" || "$STATUS" == "TimedOut" || "$STATUS" == "Cancelled" ]]; then
              echo "Scoring failed."

              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query 'StandardErrorContent' \
                --output text

              exit 1
            fi

            sleep 15
          done

          echo "Timed out waiting for scoring."
          exit 1

      # Step 5: Stop EC2 after success or failure
      - name: Stop EC2 instance
        if: ${{ always() && steps.ec2.outputs.started == 'true' }}
        run: |
          aws ec2 stop-instances --instance-ids "$INSTANCE_ID"
          aws ec2 wait instance-stopped --instance-ids "$INSTANCE_ID"

          echo "EC2 instance stopped."